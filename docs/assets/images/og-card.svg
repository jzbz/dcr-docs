    <text x="115" y="76" font-family="Noto Sans, sans-serif" font-weight="700" font-size="40" fill="#eef1f8">Decred Docs</text>
  </g>

  <!-- headline -->
  <text x="82" y="318" font-family="Noto Sans, sans-serif" font-weight="700" font-size="68" fill="#eef1f8">Guides for Decred</text>
  <text x="82" y="398" font-family="Noto Sans, sans-serif" font-weight="700" font-size="68" fill="#eef1f8">users and builders</text>

  <!-- subtitle -->
  <text x="84" y="468" font-family="Noto Sans, sans-serif" font-size="25" fill="#9aa3b8">Staking, privacy, governance, the treasury and DCRDEX,</text>
  <text x="84" y="503" font-family="Noto Sans, sans-serif" font-size="25" fill="#9aa3b8">with developer docs and the technical whitepaper.</text>

  <!-- url chip -->
  <g transform="translate(84 545)">
    <rect width="202" height="44" rx="12" fill="#2ED6A1" fill-opacity="0.1" stroke="#2ED6A1" stroke-opacity="0.3"/>
    <circle cx="24" cy="22" r="5" fill="#2ED6A1"/>
    <text x="42" y="29" font-family="Noto Sans Mono, monospace" font-size="19" fill="#2ED6A1">docs.dcr.pw</text>
  </g>
