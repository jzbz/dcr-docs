<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ED6A1"/>
      <stop offset="1" stop-color="#36C5E0"/>
    </linearGradient>
    <radialGradient id="glowTurq" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ED6A1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2ED6A1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2970FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2970FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background + ambient glows -->
  <rect width="1200" height="630" fill="#05070e"/>
  <circle cx="120" cy="80" r="420" fill="url(#glowTurq)"/>
  <circle cx="1120" cy="600" r="460" fill="url(#glowBlue)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- right side: the three sections as cards -->
  <g font-family="Noto Sans, sans-serif">
    <g transform="translate(776 150)">
      <rect width="356" height="96" rx="18" fill="#2ED6A1" fill-opacity="0.1" stroke="#2ED6A1" stroke-opacity="0.35" stroke-width="1.5"/>
      <g transform="translate(28 30)" fill="none" stroke="#2ED6A1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 7v25"/>
        <path d="M3 30a1.5 1.5 0 0 1-1.5-1.5V6A1.5 1.5 0 0 1 3 4.500h7.500a7.500 7.500 0 0 1 7.500 6 7.500 7.500 0 0 1 7.500-6H33A1.500 1.500 0 0 1 34.500 6v22.500A1.500 1.500 0 0 1 33 30h-9a6 6 0 0 0-6 6 6 6 0 0 0-6-6z" transform="translate(0 -2)"/>
      </g>
      <text x="86" y="45" font-weight="700" font-size="25" fill="#eef1f8">User docs</text>
      <text x="86" y="73" font-size="17" fill="#9aa3b8">Wallets, staking, privacy, voting</text>
    </g>
    <g transform="translate(776 268)">
      <rect width="356" height="96" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <g transform="translate(28 30)" fill="none" stroke="#5BA8FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M26 26l8-8-8-8M10 10l-8 8 8 8M21.500 5l-7 26"/>
      </g>
      <text x="86" y="45" font-weight="700" font-size="25" fill="#eef1f8">Developer docs</text>
      <text x="86" y="73" font-size="17" fill="#9aa3b8">Protocol, APIs, integration</text>
    </g>
    <g transform="translate(776 386)">
      <rect width="356" height="96" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <g transform="translate(30 28)" fill="none" stroke="#9B8CFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 2H6a3 3 0 0 0-3 3v30a3 3 0 0 0 3 3h22a3 3 0 0 0 3-3V13z"/>
        <path d="M20 2v8a3 3 0 0 0 3 3h8M10 21h14M10 28h14"/>
      </g>
