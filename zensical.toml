[project]
site_name = "Decred Documentation"
site_url = "https://docs.dcr.pw/"
site_description = "Documentation for Decred users and developers, and the Decred technical whitepaper"
repo_url = "https://github.com/jzbz/dcr-docs"
repo_name = "jzbz/dcr-docs"
edit_uri = "edit/master/docs/"

# Each top-level entry is a tab. The whitepaper pages are generated by
# scripts/build-whitepaper.sh, which fails if this list and the pages it
# writes ever differ, and prints the list to paste here.
nav = [
  { "Home" = "index.md" },
  { "User docs" = [
    "user/index.md",
  ] },
  { "Developer docs" = [
    "dev/index.md",
  ] },
  { "Whitepaper" = [
    "whitepaper/index.md",
    "whitepaper/01-intro.md",
    "whitepaper/02-conventions.md",
    "whitepaper/03-crypto.md",
    "whitepaper/04-encoding.md",
    "whitepaper/05-addresses.md",
    "whitepaper/06-script.md",
    "whitepaper/07-transactions.md",
    "whitepaper/08-staking.md",
    "whitepaper/09-difficulty.md",
    "whitepaper/10-blocks.md",
    "whitepaper/11-subsidy.md",
    "whitepaper/12-treasury.md",
    "whitepaper/13-voting.md",
    "whitepaper/14-parameters.md",
    "whitepaper/15-p2p.md",
    "whitepaper/16-filters.md",
    "whitepaper/17-policy.md",
    "whitepaper/18-mixing.md",
    "whitepaper/19-ecosystem.md",
    "whitepaper/A-opcodes.md",
    "whitepaper/B-rule-index.md",
    "whitepaper/C-bitcoin-differences.md",
    "whitepaper/references.md",
  ] },
]

extra_css = [
  # A math font for the whitepaper's MathML. Fetched at build time and served
  # from this site by the privacy plugin.
  "https://fonts.googleapis.com/css2?family=STIX+Two+Math&display=swap",
  "stylesheets/typst-math.css",
  "stylesheets/whitepaper.css",
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.search]

# Serve fonts, emoji and scripts from this site instead of having every
# reader's browser fetch them from Google, jsDelivr and unpkg. One request
# to another host remains: the repository link in the header asks
# api.github.com for the star and fork counts.
[project.plugins.privacy]
assets_include = [
  "cdn.jsdelivr.net/gh/jdecked/twemoji@*",
  "fonts.googleapis.com/*",
  "fonts.gstatic.com/*",
  "unpkg.com/mermaid@*",
]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
